name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - ubuntu-26.04-rust-1.93
      - ubuntu-26.04-rust-1.93-distro

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build DevContainer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for non-ASCII filenames
        run: |
          if git -c core.quotepath=false ls-files | LC_ALL=C grep -q -P '[^\x20-\x7E]'; then
            echo "::error::Attempt to add non-ASCII file name(s):"
            git -c core.quotepath=false ls-files | LC_ALL=C grep -P '[^\x20-\x7E]'
            exit 1
          fi
          echo "All tracked filenames are valid ASCII."

      - name: Seed scratch image
        run: "echo 'FROM scratch' | docker build -t scratch-alias"

      - name: Build devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
