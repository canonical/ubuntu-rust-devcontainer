name: Build and Publish DevContainer

on:
  push:
    branches:
      - ubuntu-26.04-rust-1.93
      - ubuntu-26.04-rust-1.93-distro
      - ubuntu-26.10-rust-1.97
      - ubuntu-26.10-rust-1.97-distro
  schedule:
    # Triggers every Wednesday at 00:00 UTC
    - cron: '0 0 * * 3'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        branch:
          - ubuntu-26.04-rust-1.93
          - ubuntu-26.04-rust-1.93-distro
          - ubuntu-26.10-rust-1.97
          - ubuntu-26.10-rust-1.97-distro

    steps:
      - name: Skip non-matching push branch
        if: ${{ github.event_name == 'push' && github.ref_name != matrix.branch }}
        run: echo "Skipping ${{ matrix.branch }} because this push was for ${{ github.ref_name }}"

      - name: Checkout code
        if: ${{ github.event_name != 'push' || github.ref_name == matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'push' || github.ref_name == matrix.branch }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Dev Container Image
        if: ${{ github.event_name != 'push' || github.ref_name == matrix.branch }}
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/canonical/${{ matrix.branch }}-devcontainer
          imageTag: latest
          push: always
