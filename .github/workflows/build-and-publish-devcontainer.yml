name: Build and Publish DevContainer

on:
  push:
    branches:
      - ubuntu-26.04-rust-1.93
      - ubuntu-26.04-rust-1.93-distro
      - ubuntu-26.10-rust-1.97
      - ubuntu-26.10-rust-1.97-distro
  schedule:
    # Triggers every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to publish to GHCR
    strategy:
      fail-fast: false
      matrix:
        branch:
          - ubuntu-26.04-rust-1.93
          - ubuntu-26.04-rust-1.93-distro
          - ubuntu-26.10-rust-1.97
          - ubuntu-26.10-rust-1.97-distro
    # On push, only run the matrix entry matching the pushed branch.
    # On schedule or manual dispatch from main, run all matrix branches.
    if: github.event_name != 'push' || matrix.branch == github.ref_name

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Dev Container Image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/canonical/${{ matrix.branch }}-devcontainer
          imageTag: latest
          push: always
