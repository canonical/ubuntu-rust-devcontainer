name: Build and Publish DevContainer

on:
  push:
    branches:
      - ubuntu-26.04-rust-1.93
      - ubuntu-26.04-rust-1.93-distro
      - ubuntu-26.10-rust-1.97
      - ubuntu-26.10-rust-1.97-distro
  schedule:
    # Triggers the workflow every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref_name != 'main'
    permissions:
      contents: read
      packages: write # Required to publish to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Dev Container Image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/canonical/${{ github.ref_name }}-devcontainer
          imageTag: latest
          push: always

