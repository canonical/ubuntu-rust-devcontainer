name: Build and Publish DevContainer

on:
  schedule:
    # Triggers the workflow every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  discover-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
      has_branches: ${{ steps.branches.outputs.has_branches }}
    steps:
      - name: Find DevContainer branches
        id: branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = await github.paginate(github.rest.repos.listBranches, {
              ...context.repo,
              per_page: 100,
            });
            const branchPattern = /^ubuntu-\d{2}\.\d{2}-rust-\d+\.\d+(?:\.\d+)?(?:-distro)?$/;
            const builds = branches.filter(branch => branchPattern.test(branch.name)).map(branch => ({
              branch: branch.name,
              sha: branch.commit.sha,
              image: `${branch.name}-devcontainer`,
            }));
            core.setOutput('branches', JSON.stringify(builds));
            core.setOutput('has_branches', builds.length > 0);

  build-and-push:
    name: Build and push ${{ matrix.branch }}
    needs: discover-branches
    if: needs.discover-branches.outputs.has_branches == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-branches.outputs.branches) }}
    permissions:
      contents: read
      packages: write # Required to publish to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Dev Container Image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/canonical/${{ matrix.image }}
          imageTag: latest
          push: always
